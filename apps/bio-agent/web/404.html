<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Không tìm thấy trang · Short Bio Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Cùng bảng màu với template.html của Short Bio Agent */
:root{
  --bg:#f3f2ee; --surface:#ffffff; --sunk:#f6f5f1; --line:#e4e1d9; --line-2:#d2cec3;
  --ink:#1b2230; --ink-2:#2c3546; --on-ink:#ffffff; --fg:#1b2230; --muted:#5e6472; --dim:#8d919b;
  --accent:#0c7a64; --accent-soft:#e1f2ec; --accent-fg:#0a5f4e;
  --shadow:0 1px 2px rgba(27,34,48,.05),0 12px 32px -16px rgba(27,34,48,.22);
  --f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-doc:"Source Serif 4",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --surface:#171b22; --sunk:#1c2129; --line:#262c35; --line-2:#353c47;
  --ink:#eef0f3; --ink-2:#d6dae1; --on-ink:#101318; --fg:#eceef2; --muted:#a3a9b5; --dim:#767d8a;
  --accent:#4cc9a6; --accent-soft:#143a31; --accent-fg:#7fe0c3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --surface:#171b22; --sunk:#1c2129; --line:#262c35; --line-2:#353c47;
  --ink:#eef0f3; --ink-2:#d6dae1; --on-ink:#101318; --fg:#eceef2; --muted:#a3a9b5; --dim:#767d8a;
  --accent:#4cc9a6; --accent-soft:#143a31; --accent-fg:#7fe0c3;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
main{width:min(460px,100%);display:grid;gap:22px;justify-items:center;text-align:center}
.sheet{position:relative;width:132px;height:164px;border-radius:8px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:22px 18px;display:grid;gap:9px;align-content:start;transform:rotate(-4deg)}
.sheet i{display:block;height:7px;border-radius:4px;background:var(--sunk)}
.sheet i:first-child{height:12px;width:70%;background:var(--line-2)}
.sheet b{position:absolute;right:-18px;bottom:-14px;font:600 2.4rem/1 var(--f-doc);color:var(--accent);background:var(--accent-soft);border-radius:12px;padding:8px 12px;transform:rotate(4deg)}
.k{font-size:.74rem;font-weight:700;color:var(--accent-fg);letter-spacing:.06em;text-transform:uppercase}
h1{margin:4px 0 0;font-size:1.6rem;font-weight:800;letter-spacing:-.025em;line-height:1.2}
p{margin:0;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:11px;font:700 .9rem var(--f);text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);transition:transform .12s,background .15s}
.btn:hover{background:var(--ink-2);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--sunk)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
button.btn{cursor:pointer}
code{font-size:.82rem;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:1px 6px;word-break:break-all}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <div class="sheet" aria-hidden="true"><i></i><i></i><i style="width:85%"></i><i></i><i style="width:60%"></i><b>404</b></div>
  <div>
    <div class="k">Short Bio Agent</div>
    <h1>Không tìm thấy trang này</h1>
  </div>
  <p>Đường dẫn <code id="path">này</code> không có trên Short Bio Agent. Có thể link bị gõ sai hoặc trang đã được chuyển. Bio đã lưu của bạn vẫn còn trong trình duyệt.</p>
  <div class="actions">
    <a class="btn" href="/">Về trang tạo bio</a>
    <button type="button" class="btn ghost" id="back">Quay lại trang trước</button>
  </div>
</main>
<script>
  document.getElementById("path").textContent = location.pathname;
  var back = document.getElementById("back");
  if (history.length < 2) back.hidden = true;
  back.addEventListener("click", function () { history.back(); });
</script>
</body>
</html>
